name: Build CleanX universal packages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: cleanx-universal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: OpenWrt 24.10.6 universal IPK
            openwrt_version: "24.10.6"
            sdk_version: "24.10.6"
            target: "x86"
            subtarget: "64"
            format: "ipk"
            release_suffix: "all-openwrt-24.10.6-universal"
          - label: OpenWrt 25.12.4 universal APK
            openwrt_version: "25.12.4"
            sdk_version: "25.12.4"
            target: "x86"
            subtarget: "64"
            format: "apk"
            release_suffix: "all-openwrt-25.12.4-universal"
          - label: OpenWrt snapshot universal APK
            openwrt_version: "snapshot"
            sdk_version: "snapshot"
            target: "x86"
            subtarget: "64"
            format: "apk"
            release_suffix: "all-openwrt-snapshot-universal"

    steps:
      - name: Checkout CleanX source
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "CleanX version: ${VERSION}"

      - name: Install SDK host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xz-utils \
            zstd \
            libelf-dev

      - name: Download OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          SUBTARGET="${{ matrix.subtarget }}"
          VERSION="${{ matrix.sdk_version }}"

          if [ "${VERSION}" = "snapshot" ]; then
            SDK_BASE_URL="https://downloads.openwrt.org/snapshots/targets/${TARGET}/${SUBTARGET}/"
          else
            SDK_BASE_URL="https://downloads.openwrt.org/releases/${VERSION}/targets/${TARGET}/${SUBTARGET}/"
          fi

          echo "SDK URL: ${SDK_BASE_URL}"
          SDK_FILE="$(curl -fsSL "${SDK_BASE_URL}" | grep -oE 'openwrt-sdk-[^"<>]+Linux-x86_64\.tar\.(xz|zst)' | head -n 1)"

          if [ -z "${SDK_FILE}" ]; then
            echo "ERROR: Could not detect SDK file from ${SDK_BASE_URL}"
            exit 1
          fi

          echo "Detected SDK: ${SDK_FILE}"
          curl -fL "${SDK_BASE_URL}${SDK_FILE}" -o "${SDK_FILE}"

          case "${SDK_FILE}" in
            *.tar.zst) tar --zstd -xf "${SDK_FILE}" ;;
            *.tar.xz) tar -xf "${SDK_FILE}" ;;
            *) echo "ERROR: Unsupported SDK archive: ${SDK_FILE}"; exit 1 ;;
          esac

          SDK_DIR="$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)"
          if [ -z "${SDK_DIR}" ]; then
            echo "ERROR: SDK directory not found"
            exit 1
          fi

          echo "SDK_DIR=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "Using SDK directory: ${SDK_DIR}"

      - name: Prepare feeds
        working-directory: ${{ env.SDK_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy CleanX package into SDK
        shell: bash
        run: |
          set -euo pipefail
          PKG="luci-theme-cleanx"
          mkdir -p "${SDK_DIR}/package/custom/${PKG}"
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.sdk-*' \
            --exclude 'dist' \
            --exclude 'package-artifacts' \
            --exclude 'build-logs' \
            --exclude '*.zip' \
            ./ "${SDK_DIR}/package/custom/${PKG}/"

          grep -q '^PKGARCH:=all' "${SDK_DIR}/package/custom/${PKG}/Makefile"
          grep -q '^LUCI_PKGARCH:=all' "${SDK_DIR}/package/custom/${PKG}/Makefile"

      - name: Build package
        working-directory: ${{ env.SDK_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          make defconfig
          mkdir -p "${GITHUB_WORKSPACE}/build-logs"
          make package/luci-theme-cleanx/clean V=s || true
          make package/luci-theme-cleanx/compile V=s -j"$(nproc)" 2>&1 | tee "${GITHUB_WORKSPACE}/build-logs/build-${{ matrix.release_suffix }}.log"

      - name: Collect and rename universal package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-artifacts
          VERSION="${{ steps.version.outputs.version }}"
          FORMAT="${{ matrix.format }}"
          SUFFIX="${{ matrix.release_suffix }}"

          if [ "${FORMAT}" = "ipk" ]; then
            SRC="$(find "${SDK_DIR}/bin" -type f -name 'luci-theme-cleanx*.ipk' | head -n 1)"
            OUT="package-artifacts/luci-theme-cleanx_${VERSION}-r1_${SUFFIX}.ipk"
          else
            SRC="$(find "${SDK_DIR}/bin" -type f -name 'luci-theme-cleanx*.apk' | head -n 1)"
            OUT="package-artifacts/luci-theme-cleanx_${VERSION}-r1_${SUFFIX}.apk"
          fi

          if [ -z "${SRC}" ]; then
            echo "ERROR: Built ${FORMAT} package not found"
            find "${SDK_DIR}/bin" -type f | sort | tail -n 50
            exit 1
          fi

          cp -v "${SRC}" "${OUT}"
          echo "Universal release asset: ${OUT}"
          ls -lah package-artifacts

      - name: Write build summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          cat > "build-logs/summary-${{ matrix.release_suffix }}.md" <<EOF2
          # CleanX ${{ steps.version.outputs.version }} - ${{ matrix.label }}

          - Package: luci-theme-cleanx
          - Package architecture: all
          - Builder SDK target: ${{ matrix.target }}/${{ matrix.subtarget }}
          - OpenWrt generation: ${{ matrix.openwrt_version }}
          - Output format: .${{ matrix.format }}
          - Universal target: ARM, ARM64, MIPS, x86, x86_64 and other OpenWrt targets using the matching package manager generation

          The SDK target is only used as the build environment. CleanX contains no compiled binaries.
          EOF2

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleanx-${{ matrix.release_suffix }}
          path: |
            package-artifacts/*
            build-logs/*
          if-no-files-found: error

  prerelease:
    name: Publish GitHub pre-release
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout CleanX source
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}-pre.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release notes and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum luci-theme-cleanx_* > SHA256SUMS.txt
          cd ..

          cat > RELEASE_NOTES.txt <<EOF2
          # CleanX ${{ steps.version.outputs.version }} pre-release

          This is an automated CleanX pre-release build.

          ## Universal package support

          CleanX is architecture-independent. The package architecture is \`all\`, so the package is intended for ARM, ARM64, MIPS, x86, x86_64 and other OpenWrt targets using the matching OpenWrt package manager generation.

          ## Assets

          - \`luci-theme-cleanx_${{ steps.version.outputs.version }}-r1_all-openwrt-24.10.6-universal.ipk\` for OpenWrt 24.10.x / opkg generation
          - \`luci-theme-cleanx_${{ steps.version.outputs.version }}-r1_all-openwrt-25.12.4-universal.apk\` for OpenWrt 25.12+ / apk generation
          - \`luci-theme-cleanx_${{ steps.version.outputs.version }}-r1_all-openwrt-snapshot-universal.apk\` for OpenWrt snapshots / apk generation

          ## Notes

          The SDK target used in CI is only a builder environment. CleanX contains no compiled binaries and keeps \`PKGARCH:=all\` plus \`LUCI_PKGARCH:=all\`.

          Test this pre-release on your router before promoting it to a stable release.
          EOF2

          echo "Release assets:"
          find release-assets -type f -maxdepth 2 -print | sort

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            --title "CleanX ${{ steps.version.outputs.version }} pre-release" \
            --notes-file RELEASE_NOTES.txt \
            --prerelease \
            release-assets/*
