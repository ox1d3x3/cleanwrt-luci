name: Build and release CleanX

# Every push to main builds universal .ipk/.apk packages.
#   - If VERSION has no GitHub release yet -> stable release vX.Y.Z (marked latest)
#   - Otherwise                            -> pre-release vX.Y.Z-pre.<run>.<attempt>
# Bump the version with scripts/bump-version.sh to cut a new stable release.

env:
  PKG_NAME: luci-theme-cleanx

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'preview/**'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

concurrency:
  group: cleanx-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Sanity checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout CleanX source
        uses: actions/checkout@v5

      - name: Version strings match VERSION
        run: bash scripts/bump-version.sh --check

      - name: Shell scripts parse
        run: |
          set -euo pipefail
          for f in scripts/*.sh root/etc/uci-defaults/*; do
            case "$f" in *.sh) bash -n "$f" ;; *) sh -n "$f" ;; esac
            echo "ok: $f"
          done

      - name: LuCI JavaScript modules parse
        run: |
          set -euo pipefail
          for f in htdocs/luci-static/resources/*.js; do
            node -e "
              const src = require('fs').readFileSync(process.argv[1], 'utf8')
                .replace(/^'(use strict|require [^']+)';\s*/gm, '');
              new Function('baseclass', 'rpc', 'poll', 'ui', 'E', 'L', '_', src);
            " "$f"
            echo "ok: $f"
          done

      - name: ACL and JSON files parse
        run: |
          set -euo pipefail
          for f in root/usr/share/rpcd/acl.d/*.json; do
            python3 -m json.tool "$f" > /dev/null
            echo "ok: $f"
          done

  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-24.04
    needs: check

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: OpenWrt 24.10.6 universal IPK
            sdk_version: "24.10.6"
            target: "x86"
            subtarget: "64"
            format: "ipk"
            release_suffix: "all-openwrt-24.10.6-universal"
          - label: OpenWrt 25.12.4 universal APK
            sdk_version: "25.12.4"
            target: "x86"
            subtarget: "64"
            format: "apk"
            release_suffix: "all-openwrt-25.12.4-universal"
          - label: OpenWrt snapshot universal APK
            sdk_version: "snapshot"
            target: "x86"
            subtarget: "64"
            format: "apk"
            release_suffix: "all-openwrt-snapshot-universal"

    steps:
      - name: Checkout CleanX source
        uses: actions/checkout@v5

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "CleanX version: ${VERSION}"

      - name: Install SDK host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xz-utils \
            zstd \
            libelf-dev

      - name: Download OpenWrt SDK outside repository
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ matrix.target }}"
          SUBTARGET="${{ matrix.subtarget }}"
          VERSION="${{ matrix.sdk_version }}"
          SDK_WORKDIR="${RUNNER_TEMP}/openwrt-sdk-${{ matrix.release_suffix }}"

          rm -rf "${SDK_WORKDIR}"
          mkdir -p "${SDK_WORKDIR}"
          cd "${SDK_WORKDIR}"

          if [ "${VERSION}" = "snapshot" ]; then
            SDK_BASE_URL="https://downloads.openwrt.org/snapshots/targets/${TARGET}/${SUBTARGET}/"
          else
            SDK_BASE_URL="https://downloads.openwrt.org/releases/${VERSION}/targets/${TARGET}/${SUBTARGET}/"
          fi

          echo "SDK URL: ${SDK_BASE_URL}"
          curl -fsSL "${SDK_BASE_URL}" -o sdk-index.html
          SDK_FILE="$(grep -oE 'openwrt-sdk-[^"<> ]+Linux-x86_64\.tar\.(xz|zst)' sdk-index.html | sort -u | head -n 1 || true)"

          if [ -z "${SDK_FILE}" ]; then
            echo "ERROR: Could not detect SDK file from ${SDK_BASE_URL}"
            sed -n '1,120p' sdk-index.html || true
            exit 1
          fi

          echo "Detected SDK: ${SDK_FILE}"
          curl -fL "${SDK_BASE_URL}${SDK_FILE}" -o "${SDK_FILE}"

          case "${SDK_FILE}" in
            *.tar.zst) tar --zstd -xf "${SDK_FILE}" ;;
            *.tar.xz) tar -xf "${SDK_FILE}" ;;
            *) echo "ERROR: Unsupported SDK archive: ${SDK_FILE}"; exit 1 ;;
          esac

          # Detect the real SDK root after extraction. Do not use SDK_WORKDIR itself:
          # its name also starts with openwrt-sdk-* and can be accidentally matched.
          SDK_DIR=""
          for d in "${SDK_WORKDIR}"/openwrt-sdk-*; do
            if [ -d "${d}" ] && [ -f "${d}/scripts/feeds" ]; then
              SDK_DIR="${d}"
              break
            fi
          done

          if [ -z "${SDK_DIR}" ] || [ ! -d "${SDK_DIR}" ]; then
            echo "ERROR: SDK directory not found under ${SDK_WORKDIR}"
            find "${SDK_WORKDIR}" -maxdepth 2 -type d -print | sort
            exit 1
          fi

          chmod +x "${SDK_DIR}/scripts/feeds"

          # Persist for later shell steps. Values written to $GITHUB_ENV
          # are runtime shell variables, so later steps must cd "$SDK_DIR"
          # inside their run block instead of using a YAML-level directory expression.
          echo "SDK_WORKDIR=${SDK_WORKDIR}" >> "$GITHUB_ENV"
          echo "SDK_DIR=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "Using SDK workdir: ${SDK_WORKDIR}"
          echo "Using SDK directory: ${SDK_DIR}"

      - name: Prepare feeds
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SDK_DIR:-}" ] || [ ! -d "${SDK_DIR}" ]; then
            echo "ERROR: SDK_DIR is not set or does not exist: ${SDK_DIR:-<empty>}"
            exit 1
          fi

          if [ ! -f "${SDK_DIR}/scripts/feeds" ]; then
            echo "ERROR: OpenWrt SDK scripts/feeds not found at: ${SDK_DIR}/scripts/feeds"
            echo "SDK workdir contents:"
            find "${SDK_WORKDIR:-${SDK_DIR}}" -maxdepth 2 \( -type f -o -type d \) | sort | sed -n '1,160p'
            exit 1
          fi
          chmod +x "${SDK_DIR}/scripts/feeds"

          cd "${SDK_DIR}"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Stage CleanX package source
        shell: bash
        run: |
          set -euo pipefail

          PKG_SRC="${RUNNER_TEMP}/${PKG_NAME}-source"
          PKG_DST="${SDK_DIR}/package/custom/${PKG_NAME}"

          rm -rf "${PKG_SRC}" "${PKG_DST}"
          mkdir -p "${PKG_SRC}" "$(dirname "${PKG_DST}")"

          # Keep the OpenWrt SDK and generated outputs out of the package source.
          # The previous workflow extracted the SDK under GITHUB_WORKSPACE, then
          # rsynced ./ into SDK/package/custom/${PKG_NAME}, causing recursive SDK copies.
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.sdk-*' \
            --exclude 'openwrt-sdk-*' \
            --exclude 'dist' \
            --exclude 'package-artifacts' \
            --exclude 'build-logs' \
            --exclude 'docs' \
            --exclude 'preview' \
            --exclude '*.zip' \
            --exclude '*.tar.xz' \
            --exclude '*.tar.zst' \
            "${GITHUB_WORKSPACE}/" "${PKG_SRC}/"

          cp -a "${PKG_SRC}" "${PKG_DST}"

          # Ship minified CSS; the repository keeps the readable source.
          bash "${GITHUB_WORKSPACE}/scripts/minify-css.sh" "${PKG_DST}"

          grep -q '^PKGARCH:=all' "${PKG_DST}/Makefile"
          grep -q '^LUCI_PKGARCH:=all' "${PKG_DST}/Makefile"

          echo "Package source staged at: ${PKG_DST}"
          find "${PKG_DST}" -maxdepth 2 -type d | sort | sed -n '1,80p'

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SDK_DIR:-}" ] || [ ! -d "${SDK_DIR}" ]; then
            echo "ERROR: SDK_DIR is not set or does not exist: ${SDK_DIR:-<empty>}"
            exit 1
          fi

          cd "${SDK_DIR}"
          make defconfig
          mkdir -p "${GITHUB_WORKSPACE}/build-logs"
          make "package/${PKG_NAME}/clean" V=s || true
          make "package/${PKG_NAME}/compile" V=s -j"$(nproc)" 2>&1 | tee "${GITHUB_WORKSPACE}/build-logs/build-${{ matrix.release_suffix }}.log"

      - name: Collect and rename universal package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package-artifacts
          VERSION="${{ steps.version.outputs.version }}"
          FORMAT="${{ matrix.format }}"
          SUFFIX="${{ matrix.release_suffix }}"

          if [ "${FORMAT}" = "ipk" ]; then
            SRC="$(find "${SDK_DIR}/bin" -type f -name "${PKG_NAME}*.ipk" | sort | head -n 1 || true)"
            OUT="package-artifacts/${PKG_NAME}_${VERSION}-r1_${SUFFIX}.ipk"
          else
            SRC="$(find "${SDK_DIR}/bin" -type f -name "${PKG_NAME}*.apk" | sort | head -n 1 || true)"
            OUT="package-artifacts/${PKG_NAME}_${VERSION}-r1_${SUFFIX}.apk"
          fi

          if [ -z "${SRC}" ] || [ ! -f "${SRC}" ]; then
            echo "ERROR: Built ${FORMAT} package not found"
            find "${SDK_DIR}/bin" -type f | sort | tail -n 80
            exit 1
          fi

          cp -v "${SRC}" "${OUT}"
          echo "Universal release asset: ${OUT}"
          ls -lah package-artifacts

      - name: Write build summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          cat > "build-logs/summary-${{ matrix.release_suffix }}.md" <<EOF2
          # CleanX ${{ steps.version.outputs.version }} - ${{ matrix.label }}

          - Package: ${PKG_NAME}
          - Package architecture: all
          - Builder SDK target: ${{ matrix.target }}/${{ matrix.subtarget }}
          - OpenWrt SDK generation: ${{ matrix.sdk_version }}
          - Output format: .${{ matrix.format }}
          - Universal target: ARM, ARM64, MIPS, x86, x86_64 and other OpenWrt targets using the matching OpenWrt package-manager generation

          The SDK target is only used as the build environment. CleanX contains no compiled binaries.
          EOF2

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: cleanx-${{ matrix.release_suffix }}
          path: |
            package-artifacts/*
            build-logs/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout CleanX source
        uses: actions/checkout@v5

      - name: Decide release type
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            TAG="v${VERSION}-pre.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            KIND="prerelease"
          else
            TAG="v${VERSION}"
            KIND="stable"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "kind=${KIND}"       >> "$GITHUB_OUTPUT"
          echo "Publishing ${KIND} release ${TAG}"

      - name: Download package artifacts
        uses: actions/download-artifact@v7
        with:
          path: downloaded-artifacts

      - name: Collect packages and checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          find downloaded-artifacts -type f \( -name "${PKG_NAME}_*.ipk" -o -name "${PKG_NAME}_*.apk" \) -exec cp -v {} dist/ \;

          shopt -s nullglob
          packages=(dist/*.ipk dist/*.apk)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "ERROR: no packages found in build artifacts"
            find downloaded-artifacts -maxdepth 6 -print | sort
            exit 1
          fi
          (cd dist && sha256sum *.ipk *.apk | sort -k2 > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          KIND: ${{ steps.version.outputs.kind }}
        run: |
          set -euo pipefail
          {
            if [ "${KIND}" = "prerelease" ]; then
              echo "> Automated pre-release build from \`${GITHUB_SHA::7}\`. Test on your router before relying on it."
              echo
            fi

            # Changes: the CHANGELOG section for this version, without its heading.
            awk -v v="${VERSION}" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/          { exit }
              on && /^\[[0-9.]+\]: /  { exit }
              on                       { print }
            ' CHANGELOG.md

            cat <<EOF

          ## Which package do I need?

          | Router firmware | Package manager | Download |
          | --- | --- | --- |
          | OpenWrt 24.10 and older | \`opkg\` | \`${PKG_NAME}_${VERSION}-r1_all-openwrt-24.10.6-universal.ipk\` |
          | OpenWrt 25.12 and newer | \`apk\` | \`${PKG_NAME}_${VERSION}-r1_all-openwrt-25.12.4-universal.apk\` |
          | OpenWrt snapshot | \`apk\` | \`${PKG_NAME}_${VERSION}-r1_all-openwrt-snapshot-universal.apk\` |

          Packages are architecture-independent (\`all\`) and work on any CPU target.
          Quick install on the router:

          \`\`\`sh
          wget -O- https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | sh
          \`\`\`

          SHA256 checksums are in \`SHA256SUMS.txt\`.
          EOF
          } | sed 's/^          //' > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          KIND: ${{ steps.version.outputs.kind }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${KIND}" = "stable" ]; then
            gh release create "${TAG}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "CleanX ${VERSION}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create "${TAG}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "CleanX ${VERSION} pre-release ${GITHUB_RUN_NUMBER}" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
