name: Build X1Wrt OpenWrt packages

env:
  PACKAGE_NAME: luci-theme-x1wrt
  TARGET: mediatek
  SUBTARGET: mt7622

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "Makefile"
      - "htdocs/**"
      - "root/**"
      - "ucode/**"
      - "scripts/**"
      - ".github/workflows/build-openwrt-packages.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # Redmi AX6S / Xiaomi AX3200 family target: mediatek/mt7622
          # OpenWrt 24.10.x still uses opkg/IPK.
          - label: OpenWrt 24.10.2 IPK
            sdk_base_url: https://downloads.openwrt.org/releases/24.10.2/targets/mediatek/mt7622/
            format: ipk
            artifact_suffix: openwrt-24.10.2-mt7622-ipk

          # OpenWrt 25.12+ uses apk.
          - label: OpenWrt 25.12.0 APK
            sdk_base_url: https://downloads.openwrt.org/releases/25.12.0/targets/mediatek/mt7622/
            format: apk
            artifact_suffix: openwrt-25.12.0-mt7622-apk

          # Current snapshot also uses apk. Snapshot packages must match snapshot firmware closely.
          - label: OpenWrt Snapshot APK
            sdk_base_url: https://downloads.openwrt.org/snapshots/targets/mediatek/mt7622/
            format: apk
            artifact_suffix: openwrt-snapshot-mt7622-apk

    steps:
      - name: Checkout theme source
        uses: actions/checkout@v4
        with:
          path: theme

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xz-utils \
            zstd \
            libelf-dev

      - name: Download OpenWrt SDK
        run: |
          set -euo pipefail

          SDK_BASE_URL="${{ matrix.sdk_base_url }}"
          echo "SDK base URL: ${SDK_BASE_URL}"

          SDK_FILE="$(
            curl -fsSL "${SDK_BASE_URL}" \
              | grep -oE 'openwrt-sdk-[^"<>]+Linux-x86_64\.tar\.(xz|zst)' \
              | head -n 1
          )"

          if [ -z "${SDK_FILE}" ]; then
            echo "ERROR: Could not detect OpenWrt SDK archive from ${SDK_BASE_URL}"
            exit 1
          fi

          echo "Detected SDK archive: ${SDK_FILE}"
          curl -fL "${SDK_BASE_URL}${SDK_FILE}" -o "${SDK_FILE}"

          case "${SDK_FILE}" in
            *.tar.zst) tar --zstd -xf "${SDK_FILE}" ;;
            *.tar.xz)  tar -xf "${SDK_FILE}" ;;
            *) echo "ERROR: unsupported SDK archive: ${SDK_FILE}"; exit 1 ;;
          esac

          SDK_DIR="$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)"
          if [ -z "${SDK_DIR}" ]; then
            echo "ERROR: SDK directory not found after extraction"
            exit 1
          fi

          echo "SDK_DIR=${SDK_DIR}" >> "${GITHUB_ENV}"
          echo "Using SDK directory: ${SDK_DIR}"

      - name: Prepare OpenWrt feeds
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add X1Wrt package
        run: |
          set -euo pipefail

          mkdir -p "${SDK_DIR}/package/custom/${PACKAGE_NAME}"
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "*.zip" \
            --exclude "artifacts" \
            theme/ "${SDK_DIR}/package/custom/${PACKAGE_NAME}/"

          echo "Package files copied:"
          find "${SDK_DIR}/package/custom/${PACKAGE_NAME}" -maxdepth 3 -type f | sort

      - name: Build package
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -euo pipefail
          make defconfig
          make "package/${PACKAGE_NAME}/clean" V=s || true
          make "package/${PACKAGE_NAME}/compile" V=s -j"$(nproc)"

      - name: Collect package artifacts
        run: |
          set -euo pipefail

          mkdir -p artifacts
          find "${SDK_DIR}/bin" -type f \
            \( \
              -name "${PACKAGE_NAME}_*.ipk" \
              -o -name "${PACKAGE_NAME}-*.apk" \
              -o -name "${PACKAGE_NAME}_*.apk" \
            \) \
            -exec cp -v {} artifacts/ \;

          echo "Collected artifacts:"
          ls -lah artifacts

          if [ "${{ matrix.format }}" = "ipk" ]; then
            test "$(find artifacts -type f -name '*.ipk' | wc -l)" -gt 0
          fi

          if [ "${{ matrix.format }}" = "apk" ]; then
            test "$(find artifacts -type f -name '*.apk' | wc -l)" -gt 0
          fi

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x1wrt-${{ matrix.artifact_suffix }}
          path: artifacts/*
          if-no-files-found: error
